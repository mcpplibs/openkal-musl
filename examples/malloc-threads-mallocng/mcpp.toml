# examples/malloc-threads under musl's own allocator: the same source, with
# `malloc-mallocng' selected in place of the default `malloc-mimalloc'.
[package]
name    = "malloc-threads-mallocng"
version = "0.1.0"

[dependencies]
openkal-musl = { path = "../..", default-features = false, features = ["posix", "image-builtins", "malloc-mallocng"] }

[targets.malloc-threads]
kind = "bin"
main = "../malloc-threads/src/main.c"

[build]
cxx_runtime = "host-coupled"
sources = []

# The image form: the platform states everything an image needs but its C
# library, which is this package, here by path. A C program has no C++
# run-time, and this package's own feature `image-builtins' is the compiler's
# run-time (mcpp 2026.10.27.1+ builds an ok image through openkal-platform).
[target.'cfg(os = "openkal")'.layers]
compiler-runtime = false
"c++-abi"        = false
