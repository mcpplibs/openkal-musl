[package]
name    = "terminal"
version = "0.1.0"

[dependencies]
openkal-musl = { path = "../.." }

[targets.terminal]
kind = "bin"
main = "src/main.c"

# The same one line every probe here writes, and for the reason examples/posix
# states: a program above this package carries no other runtime, so the build
# tool must embed none.
[build]
cxx_runtime = "host-coupled"
