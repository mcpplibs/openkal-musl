# An ok image that places another with `dlopen' (target `<arch>-openkal';
# openkal SPEC clause 12). The image this program places is built from
# plugin/, an image of its own with no C library, and is named on the command
# line: it is not linked to this one.
[package]
name    = "image-dlopen"
version = "0.1.0"

[dependencies]
openkal-musl = { path = "../.." }

[targets.image-dlopen]
kind = "bin"
main = "src/main.c"

# The image form: the platform states everything an image needs but its C
# library, which is this package, here by path. A C program has no C++
# run-time, and this package's own feature `image-builtins' is the compiler's
# run-time (mcpp 2026.10.27.1+ builds an ok image through openkal-platform).
[target.'cfg(os = "openkal")'.layers]
compiler-runtime = false
"c++-abi"        = false
