# The image image-dlopen places: no C library, its exports marked, its imports
# `kal_*' alone. A constructor and a destructor say when the loader ran them.
[package]
name    = "plug"
version = "0.1.0"

[targets.plug]
kind = "shared"

# No C library and no run-time: the platform's three layers are declined.
[target.'cfg(os = "openkal")'.layers]
compiler-runtime = false
"c++-abi"        = false
c-abi            = false
